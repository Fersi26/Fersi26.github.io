<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
        <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
</head>
<body>
    <button class="theme-toggle" id="themeToggle">Light Mode</button>
<div class="parallel-lines-bg"></div>
<div class="parallel-lines-overlay"></div>
    <div id="loading-screen">
        <div id="status-message">
            <h2>Portfolio Loading</h2>
            <div id="loading-text"></div>
            <div id="loading-controls">
                <p>Click on files/folders to interact</p>
            </div>
        </div>
    </div>
    <div class="portfolio-container">
        <div class="portfolio-header">
            <h1 class="wave">
                <span style="--i:0">P</span>
                <span style="--i:1">o</span>
                <span style="--i:2">r</span>
                <span style="--i:3">t</span>
                <span style="--i:4">f</span>
                <span style="--i:5">o</span>
                <span style="--i:6">l</span>
                <span style="--i:7">i</span>
                <span style="--i:8">o</span>
            </h1>
        </div>
        <div class="navigation-container">
            <button class="btn back-button" id="back-button" style="display: none;">←</button>
            <div class="breadcrumb" id="breadcrumb">
                <a href="#" data-path="">Portfolio</a>
            </div>
        </div>
        <div class="files-grid" id="files-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
        <div class="file-preview" id="file-preview" style="display: none;">
            <div class="preview-header">
                <h3 id="preview-title">File Preview</h3>
                <button class="btn" id="close-preview">Close</button>
            </div>
            <div class="preview-content" id="preview-content">
                <!-- Preview content will be inserted here -->
            </div>
        </div>
    </div>
    <script type="module">
        import { getFileIcon, getFileType, generateDescription } from './ext.js';
        import { LoadingText } from './loadingtext.js';
        class PortfolioExplorer {
constructor() {
                this.baseUrl = window.location.origin;
                this.apiBase = this.baseUrl;
                this.currentPath = '';
                this.pathHistory = [];
                this.screenshotProtectionActive = false;
                this.detectionInterval = null;
                this.winKeyPressed = false;
                this.handleVisibilityChange = this.handleVisibilityChange.bind(this);
                this.handleWindowBlur = this.handleWindowBlur.bind(this);
                this.handleWindowFocus = this.handleWindowFocus.bind(this);
                this.handleKeyDown = this.handleKeyDown.bind(this);
                this.handleKeyUp = this.handleKeyUp.bind(this);
                this.loadingText = new LoadingText('loading-text', {
                    text: 'Loading ...',
                    speed: 80,
                    delay: 70,
                    cursor: '_'
                });
                this.init();
            }
            init() {   
                document.getElementById('loading-screen').style.display = 'flex';
                this.loadingText.start();
                this.loadDirectory(this.currentPath);
                document.getElementById('close-preview').addEventListener('click', () => {
                    this.hidePreview();
                });
                document.getElementById('back-button').addEventListener('click', () => {
                    this.goBack();
                });
                document.getElementById('breadcrumb').addEventListener('click', (e) => {
                    if (e.target.tagName === 'A' && e.target.dataset.path !== undefined) {
                        e.preventDefault();
                        const path = e.target.dataset.path;
                        this.navigateToPath(path);
                    }
                });
                document.addEventListener('keydown', this.handleKeyDown);
                document.addEventListener('keyup', this.handleKeyUp);
            }
         handleKeyDown(e) {
    if (e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92) {
        this.winKeyPressed = true;
        this.showProtectionOverlay();
    }
    if (e.key === 'PrintScreen' || e.keyCode === 44) {
        this.showProtectionOverlay();   
        if (this.winKeyPressed) {
            e.preventDefault();
            setTimeout(() => this.hideProtectionOverlay(), 2000);
            return false;
        }
    }
}
handleKeyUp(e) {
    if (e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92) {
        this.winKeyPressed = false;
        this.hideProtectionOverlay();
    }
}
            async loadDirectory(path) {
                try {                   
                    this.hidePreview();
                    document.getElementById('files-grid').innerHTML = `
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    `;
                    const apiUrl = path === '' 
                        ? `${this.apiBase}/api/files`
                        : `${this.apiBase}/api/files/${encodeURIComponent(path)}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                    }
                    const data = await response.json();
                    this.currentPath = path;
                    document.getElementById('back-button').style.display = 
                        (this.currentPath !== '' || this.pathHistory.length > 0) ? 'block' : 'none';
                    this.updateBreadcrumb(data.current_path);
                    this.displayFiles(data.items || []);
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        this.loadingText.complete();
                    }, 500);
                } catch (error) {
                    console.error('Error loading directory:', error);
                    document.getElementById('files-grid').innerHTML = `
                        <div class="error-message">
                            <p>Error loading directory: ${error.message}</p>
                            <button class="btn" onclick="portfolio.loadDirectory('${path}')">Retry</button>
                        </div>
                    `;
                    document.getElementById('loading-screen').style.display = 'none';
                    this.loadingText.complete();
                }
            }
            updateBreadcrumb(currentPath) {
                const breadcrumb = document.getElementById('breadcrumb');   
                const cleanPath = currentPath.replace(/^Portfolio\/?/, '');
                const pathParts = cleanPath.split('/').filter(part => part !== '');
                
                
                let html = '<a href="#" data-path="">Portfolio</a>';
                
                
                let accumulatedPath = '';
                for (const part of pathParts) {
                    accumulatedPath += accumulatedPath ? `/${part}` : part;
                    html += `<span class="path-separator">/</span><a href="#" data-path="${accumulatedPath}">${part}</a>`;
                }
                
                breadcrumb.innerHTML = html;
            }

            displayFiles(items) {
                const filesGrid = document.getElementById('files-grid');
                
                if (!items || items.length === 0) {
                    filesGrid.innerHTML = '<div class="no-items">This folder is empty</div>';
                    return;
                }
                
                let html = '';
                
                
                items.filter(item => item.is_dir).forEach(item => {
                    html += this.createFolderItem(item);
                });
                
                
                items.filter(item => !item.is_dir).forEach(item => {
                    html += this.createFileItem(item);
                });
                
                filesGrid.innerHTML = html;
                
                
                document.querySelectorAll('.folder-item').forEach(element => {
                    element.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('btn')) {
                            const path = element.dataset.path;
                            this.navigateToPath(path);
                        }
                    });
                });
                
                document.querySelectorAll('.file-item .btn.preview').forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const path = button.dataset.path;
                        this.previewFile(path);
                    });
                });
                
                document.querySelectorAll('.file-item .btn.download').forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const path = button.dataset.path;
                        this.downloadFile(path);
                    });
                });
            }

            createFolderItem(item) {
                return `
                    <div class="folder-item" data-path="${item.path}">
                        <div class="item-icon">${getFileIcon(item.name, true)}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-type">Folder</div>
                        <div class="item-description">${generateDescription(item.name, true)}</div>
                    </div>
                `;
            }

            createFileItem(item) {
                return `
                    <div class="file-item">
                        <div class="item-icon">${getFileIcon(item.name, false)}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-type">${getFileType(item.name)}</div>
                        <div class="item-description">${generateDescription(item.name, false)}</div>
                        <div class="item-actions">
                            <button class="btn preview" data-path="${item.path}">Preview</button>
                            <button class="btn download" data-path="${item.path}">Download</button>
                        </div>
                    </div>
                `;
            }

            navigateToPath(path) {
                
                this.hidePreview();
                
                
                if (this.currentPath !== '') {
                    this.pathHistory.push(this.currentPath);
                }
                
                
                document.getElementById('loading-screen').style.display = 'flex';
                this.loadingText.setText('Opening folder...');
                this.loadingText.start();
                
                this.loadDirectory(path);
            }
            
            goBack() {
                
                this.hidePreview();
                
                if (this.pathHistory.length > 0) {
                    const previousPath = this.pathHistory.pop();
                    
                    
                    document.getElementById('loading-screen').style.display = 'flex';
                    this.loadingText.setText('Previous folder...');
                    this.loadingText.start();
                    
                    this.loadDirectory(previousPath);
                } else if (this.currentPath !== '') {
                    
                    
                    
                    document.getElementById('loading-screen').style.display = 'flex';
                    this.loadingText.setText('Loading ...');
                    this.loadingText.start();
                    
                    this.loadDirectory('');
                }
            }

handleVisibilityChange() {
        if (document.hidden) {
            
            this.showProtectionOverlay();
        } else {
            
            this.hideProtectionOverlay();
        }
    }
    handleWindowBlur() {
        this.showProtectionOverlay();
    }

            async previewFile(filePath) {
    try {
        this.activateScreenshotProtection();

        
        document.getElementById('preview-content').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
            </div>
        `;
        document.getElementById('file-preview').style.display = 'block';
        
        const response = await fetch(`${this.apiBase}/api/file-content-enhanced/${encodeURIComponent(filePath)}`);
        
        if (!response.ok) {
            throw new Error(`Server returned ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        const fileName = filePath.split('/').pop();
        
        
        document.getElementById('preview-title').textContent = fileName;
        
        
        let previewHtml = '';
        
        if (data.type === 'text') {
            
            if (this.isSpecialCharacterContent(data.content)) {
                previewHtml = `
                    <div class="no-preview">
                        <p>This appears to contain special characters in the output</p>
                        <p>try downloading instead</p>
                        <button class="btn download-full" data-path="${filePath}">Download File</button>
                    </div>
                `;
            } else {
                
                previewHtml = `
                    <div class="text-content-protected" 
                         oncontextmenu="return false" 
                         onselectstart="return false" 
                         oncopy="return false" 
                         oncut="return false" 
                         onpaste="return false" 
                         ondrag="return false" 
                         ondrop="return false">
                        ${this.protectTextContent(data.content)}
                    </div>
                    ${data.content.length >= 4000 ? '<p class="truncated">Preview truncated. Download to view full content.</p>' : ''}
                `;
            }
        } 
        else if (data.type === 'image') {
            
            previewHtml = `
                <div class="image-protection-container">
                    <div class="protection-overlay" oncontextmenu="return false"></div>
                    <img src="${data.content}" alt="${fileName}" class="image-preview protected-image" 
                         oncontextmenu="return false" ondragstart="return false">
                </div>
            `;
        }
        else if (data.type === 'audio') {
            previewHtml = `
                <audio controls style="width: 100%;" oncontextmenu="return false">
                    <source src="${data.content}" type="${data.mimetype}">
                    Your browser does not support the audio element.
                </audio>
            `;
        }
        else {
            previewHtml = `
                <div class="no-preview">
                    <p>This file cannot be previewed</p>
                    <p>download instead</p>
                    <button class="btn download-full" data-path="${filePath}">Download File</button>
                </div>
            `;
        }
        
        
        previewHtml += `
            <div class="file-info" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <p><strong>Type:</strong> ${data.mimetype || 'Unknown'}</p>
                <p><strong>Size:</strong> ${this.formatFileSize(data.size)}</p>
                <p><strong>Protection:</strong> Copying and screenshots disabled</p>
            </div>
        `;
        
        document.getElementById('preview-content').innerHTML = previewHtml;
        
        
        this.applyCopyProtection();
        
        
        const downloadBtn = document.querySelector('.download-full');
        if (downloadBtn) {
            downloadBtn.addEventListener('click', () => {
                this.downloadFile(filePath);
            });
        }
        
    } catch (error) {
        console.error('Error previewing file:', error);
        document.getElementById('preview-content').innerHTML = `
            <div class="error-message">
                <p>Error loading file: ${error.message}</p>
            </div>
        `;
    }
}
protectTextContent(content) {
    
    
    let protectedContent = '';
    for (let i = 0; i < content.length; i++) {
        protectedContent += content[i];
        
        if (i < content.length - 1) {
            protectedContent += '&#8203;';
        }
    }
    
    
    
    
    
    
    return protectedContent;
}
applyCopyProtection() {
    
    document.addEventListener('contextmenu', this.preventAction);
    
    
    document.addEventListener('selectstart', this.preventAction);
    
    
    document.addEventListener('copy', this.preventAction);
    document.addEventListener('cut', this.preventAction);
    document.addEventListener('paste', this.preventAction);
    
    
    document.addEventListener('dragstart', this.preventAction);
    document.addEventListener('drop', this.preventAction);
    
    
    document.addEventListener('keydown', this.disableScreenshotKeys);
    
    
    this.addProtectiveOverlay();
}
addProtectiveOverlay() {
    
    const overlay = document.createElement('div');
    overlay.id = 'protection-overlay';
    overlay.style.position = 'fixed';
    overlay.style.top = '0';
    overlay.style.left = '0';
    overlay.style.width = '100%';
    overlay.style.height = '100%';
    overlay.style.zIndex = '9998';
    overlay.style.pointerEvents = 'none';
    overlay.style.background = 'transparent';
    overlay.style.opacity = '0';
    document.body.appendChild(overlay);
}
activateScreenshotProtection() {
    if (this.screenshotProtectionActive) return;
    
    this.screenshotProtectionActive = true;
    
    
    this.overlay = document.createElement('div');
    this.overlay.id = 'screenshot-protection-overlay';
    this.overlay.style.position = 'fixed';
    this.overlay.style.top = '0';
    this.overlay.style.left = '0';
    this.overlay.style.width = '100%';
    this.overlay.style.height = '100%';
    this.overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.95)';
    this.overlay.style.zIndex = '100000';
    this.overlay.style.display = 'none'; 
    this.overlay.style.justifyContent = 'center';
    this.overlay.style.alignItems = 'center';
    this.overlay.style.color = 'white';
    this.overlay.style.fontSize = '24px';
    this.overlay.style.fontFamily = 'Arial, sans-serif';
    this.overlay.style.backdropFilter = 'blur(10px)';
    this.overlay.innerHTML = '<div>Screenshot protection active. Content hidden for security.</div>';
    document.body.appendChild(this.overlay);
    
    
    document.addEventListener('visibilitychange', this.handleVisibilityChange);
    window.addEventListener('blur', this.handleWindowBlur);
    window.addEventListener('focus', this.handleWindowFocus);
}
    deactivateScreenshotProtection() {
        if (!this.screenshotProtectionActive) return;
        
        this.screenshotProtectionActive = false;
        
        
        if (this.overlay && this.overlay.parentNode) {
            this.overlay.parentNode.removeChild(this.overlay);
        }
        
        
        document.removeEventListener('visibilitychange', this.handleVisibilityChange);
        window.removeEventListener('blur', this.handleWindowBlur);
    }
showProtectionOverlay() {
    if (!this.overlay) {
        
        this.overlay = document.createElement('div');
        this.overlay.id = 'screenshot-protection-overlay';
        this.overlay.style.position = 'fixed';
        this.overlay.style.top = '0';
        this.overlay.style.left = '0';
        this.overlay.style.width = '100%';
        this.overlay.style.height = '100%';
        this.overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.95)';
        this.overlay.style.zIndex = '100000';
        this.overlay.style.display = 'none';
        this.overlay.style.justifyContent = 'center';
        this.overlay.style.alignItems = 'center';
        this.overlay.style.color = 'white';
        this.overlay.style.fontSize = '24px';
        this.overlay.style.fontFamily = 'Arial, sans-serif';
        this.overlay.style.backdropFilter = 'blur(10px)';
        this.overlay.innerHTML = '<div>Screenshot protection active. Content hidden for security.</div>';
        document.body.appendChild(this.overlay);
    }
    
    
    this.overlay.style.display = 'flex';
}
hideProtectionOverlay() {
    if (this.overlay) {
        this.overlay.style.display = 'none';
    }
}
downloadFile(filePath) {
    
    const overlay = document.createElement('div');
    overlay.style.position = 'fixed';
    overlay.style.top = '0';
    overlay.style.left = '0';
    overlay.style.width = '100%';
    overlay.style.height = '100%';
    overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
    overlay.style.display = 'flex';
    overlay.style.justifyContent = 'center';
    overlay.style.alignItems = 'center';
    overlay.style.zIndex = '10000';
    
    const dialog = document.createElement('div');
    dialog.style.backgroundColor = 'rgba(69, 23, 23, 0.95)';
    dialog.style.padding = '20px';
    dialog.style.borderRadius = '8px';
    dialog.style.border = '1px solid #ff6464';
    dialog.style.boxShadow = '0 5px 15px rgba(0, 0, 0, 0.5)';
    dialog.style.minWidth = '300px';
    dialog.style.textAlign = 'center';
    
    const title = document.createElement('h3');
    title.textContent = 'Enter Download Code';
    title.style.color = '#ff6464';
    title.style.marginTop = '0';
    dialog.appendChild(title);
    
    const inputContainer = document.createElement('div');
    inputContainer.style.margin = '20px 0';
    
    const codeInput = document.createElement('input');
    codeInput.type = 'password';
    codeInput.placeholder = 'Enter password';
    codeInput.style.padding = '10px';
    codeInput.style.width = '200px';
    codeInput.style.border = '1px solid #ff6464';
    codeInput.style.borderRadius = '4px';
    codeInput.style.backgroundColor = 'rgba(47, 10, 10, 0.7)';
    codeInput.style.color = '#ffe6e6';
    codeInput.style.fontSize = '16px';
    codeInput.style.textAlign = 'center';
    
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    `;
    document.head.appendChild(style);
    
    inputContainer.appendChild(codeInput);
    dialog.appendChild(inputContainer);
    
    const buttonContainer = document.createElement('div');
    buttonContainer.style.display = 'flex';
    buttonContainer.style.justifyContent = 'center';
    buttonContainer.style.gap = '10px';
    
    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = 'Download';
    downloadBtn.style.padding = '8px 15px';
    downloadBtn.style.background = 'rgba(255, 100, 100, 0.2)';
    downloadBtn.style.color = '#ff6464';
    downloadBtn.style.border = '1px solid #ff6464';
    downloadBtn.style.borderRadius = '4px';
    downloadBtn.style.cursor = 'pointer';
    downloadBtn.style.transition = 'all 0.3s ease';
    
    downloadBtn.addEventListener('mouseenter', () => {
        downloadBtn.style.background = 'rgba(255, 100, 100, 0.3)';
    });
    
    downloadBtn.addEventListener('mouseleave', () => {
        downloadBtn.style.background = 'rgba(255, 100, 100, 0.2)';
    });
    
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.padding = '8px 15px';
    cancelBtn.style.background = 'rgba(100, 100, 100, 0.2)';
    cancelBtn.style.color = '#b08888';
    cancelBtn.style.border = '1px solid #b08888';
    cancelBtn.style.borderRadius = '4px';
    cancelBtn.style.cursor = 'pointer';
    cancelBtn.style.transition = 'all 0.3s ease';
    
    cancelBtn.addEventListener('mouseenter', () => {
        cancelBtn.style.background = 'rgba(100, 100, 100, 0.3)';
    });
    
    cancelBtn.addEventListener('mouseleave', () => {
        cancelBtn.style.background = 'rgba(100, 100, 100, 0.2)';
    });
    
    buttonContainer.appendChild(downloadBtn);
    buttonContainer.appendChild(cancelBtn);
    dialog.appendChild(buttonContainer);
    
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    
    
    setTimeout(() => codeInput.focus(), 100);
    
    
    const checkPassword = () => {
        
        if (codeInput.value === '123') {
            
            const fileUrl = `${this.apiBase}/api/raw-file/${encodeURIComponent(filePath)}`;
            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = filePath.split('/').pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            
            document.body.removeChild(overlay);
            document.head.removeChild(style);
        } else {
            
            codeInput.style.animation = 'shake 0.5s';
            codeInput.value = '';
            setTimeout(() => {
                codeInput.style.animation = '';
            }, 500);
        }
    };
    
    
    codeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });
    
    downloadBtn.addEventListener('click', checkPassword);
    
    cancelBtn.addEventListener('click', () => {
        document.body.removeChild(overlay);
        document.head.removeChild(style);
    });
    
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            document.body.removeChild(overlay);
            document.head.removeChild(style);
        }
    });
    
    
    const escapeHandler = (e) => {
        if (e.key === 'Escape') {
            document.body.removeChild(overlay);
            document.head.removeChild(style);
            document.removeEventListener('keydown', escapeHandler);
        }
    };
    
    document.addEventListener('keydown', escapeHandler);
}
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            isSpecialCharacterContent(content) {
                
                if (!content || content.length === 0) return false;
                
                
                let specialCharCount = 0;
                const sampleSize = Math.min(content.length, 1000);
                
                for (let i = 0; i < sampleSize; i++) {
                    const charCode = content.charCodeAt(i);
                    
                    if (charCode < 32 && charCode !== 9 && charCode !== 10 && charCode !== 13) {
                        specialCharCount++;
                    }
                    
                    else if (charCode > 126 && charCode < 160) {
                        specialCharCount++;
                    }
                }
                
                
                return (specialCharCount / sampleSize) > 0.3;
            }
preventAction(e) {
    e.preventDefault();
    return false;
}
disableScreenshotKeys(e) {
    
    if (e.key === 'PrintScreen' || e.keyCode === 44) {
        e.preventDefault();
        this.showProtectionOverlay();
        setTimeout(() => this.hideProtectionOverlay(), 2000);
        return false;
    }
    
    
    if (this.winKeyPressed && (e.key === 'PrintScreen' || e.keyCode === 44)) {
        e.preventDefault();
        this.showProtectionOverlay();
        setTimeout(() => this.hideProtectionOverlay(), 2000);
        return false;
    }
    
    
    if (e.altKey && (e.key === 'PrintScreen' || e.keyCode === 44)) {
        e.preventDefault();
        this.showProtectionOverlay();
        setTimeout(() => this.hideProtectionOverlay(), 2000);
        return false;
    }
    
    
    if (e.ctrlKey && (e.key === 'PrintScreen' || e.keyCode === 44)) {
        e.preventDefault();
        this.showProtectionOverlay();

class ScreenshotProtection {
    constructor() {
        this.screenshotProtectionActive = false;
        this.overlay = null;
        this.winKeyPressed = false;
        this.ctrlKeyPressed = false;
        this.altKeyPressed = false;
        this.shiftKeyPressed = false;
        this.detectionInterval = null;
        this.keyboardBlocked = false;
        this.blockAllKeys = false;
        
        
        this.handleVisibilityChange = this.handleVisibilityChange.bind(this);
        this.handleWindowBlur = this.handleWindowBlur.bind(this);
        this.handleWindowFocus = this.handleWindowFocus.bind(this);
        this.handleKeyDown = this.handleKeyDown.bind(this);
        this.handleKeyUp = this.handleKeyUp.bind(this);
        this.detectDevTools = this.detectDevTools.bind(this);
        this.preventAction = this.preventAction.bind(this);
        this.disableScreenshotKeys = this.disableScreenshotKeys.bind(this);
        this.blockPrintScreen = this.blockPrintScreen.bind(this);
        this.clearClipboard = this.clearClipboard.bind(this);
        this.clearClipboardFallback = this.clearClipboardFallback.bind(this);
        this.showProtectionOverlay = this.showProtectionOverlay.bind(this);
        this.hideProtectionOverlay = this.hideProtectionOverlay.bind(this);
        this.addPrintScreenBlocking = this.addPrintScreenBlocking.bind(this);
        this.removePrintScreenBlocking = this.removePrintScreenBlocking.bind(this);
        this.addCanvasProtection = this.addCanvasProtection.bind(this);
        this.removeCanvasProtection = this.removeCanvasProtection.bind(this);
        this.startDevToolsDetection = this.startDevToolsDetection.bind(this);
        this.stopDevToolsDetection = this.stopDevToolsDetection.bind(this);
        this.applyCopyProtection = this.applyCopyProtection.bind(this);
        this.removeCopyProtection = this.removeCopyProtection.bind(this);
        this.addProtectiveCSS = this.addProtectiveCSS.bind(this);
        this.removeProtectiveCSS = this.removeProtectiveCSS.bind(this);
        this.blockAllKeyboardInput = this.blockAllKeyboardInput.bind(this);
        this.releaseAllKeyboardInput = this.releaseAllKeyboardInput.bind(this);
    }

    activateScreenshotProtection(blockKeyboard = false) {
        if (this.screenshotProtectionActive) return;
        
        this.screenshotProtectionActive = true;
        this.blockAllKeys = blockKeyboard;
        
        
        this.overlay = document.createElement('div');
        this.overlay.id = 'screenshot-protection-overlay';
        this.overlay.style.position = 'fixed';
        this.overlay.style.top = '0';
        this.overlay.style.left = '0';
        this.overlay.style.width = '100%';
        this.overlay.style.height = '100%';
        this.overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.95)';
        this.overlay.style.zIndex = '100000';
        this.overlay.style.display = 'none';
        this.overlay.style.justifyContent = 'center';
        this.overlay.style.alignItems = 'center';
        this.overlay.style.color = 'white';
        this.overlay.style.fontSize = '24px';
        this.overlay.style.fontFamily = 'Arial, sans-serif';
        this.overlay.style.backdropFilter = 'blur(10px)';
        this.overlay.innerHTML = '<div>Content protected. Screenshots disabled.</div>';
        document.body.appendChild(this.overlay);
        
        
        document.addEventListener('visibilitychange', this.handleVisibilityChange);
        window.addEventListener('blur', this.handleWindowBlur);
        window.addEventListener('focus', this.handleWindowFocus);
        document.addEventListener('keydown', this.handleKeyDown);
        document.addEventListener('keyup', this.handleKeyUp);
        
        
        this.applyCopyProtection();
        
        
        this.startDevToolsDetection();
        
        
        this.addProtectiveCSS();
        
        
        this.addPrintScreenBlocking();
        
        
        this.addCanvasProtection();
        
        
        if (blockKeyboard) {
            this.blockAllKeyboardInput();
        }
        
        console.log("Screenshot protection activated" + (blockKeyboard ? " with keyboard blocking" : ""));
    }
    
    deactivateScreenshotProtection() {
        if (!this.screenshotProtectionActive) return;
        
        this.screenshotProtectionActive = false;
        this.blockAllKeys = false;
        
        
        if (this.overlay && this.overlay.parentNode) {
            this.overlay.parentNode.removeChild(this.overlay);
        }
        
        
        document.removeEventListener('visibilitychange', this.handleVisibilityChange);
        window.removeEventListener('blur', this.handleWindowBlur);
        window.removeEventListener('focus', this.handleWindowFocus);
        document.removeEventListener('keydown', this.handleKeyDown);
        document.removeEventListener('keyup', this.handleKeyUp);
        
        
        this.removeCopyProtection();
        
        
        this.stopDevToolsDetection();
        
        
        this.removeProtectiveCSS();
        
        
        this.removePrintScreenBlocking();
        
        
        this.removeCanvasProtection();
        
        
        this.releaseAllKeyboardInput();
        
        console.log("Screenshot protection deactivated");
    }
    
    handleVisibilityChange() {
        if (document.hidden) {
            
            this.showProtectionOverlay();
        } else {
            
            this.hideProtectionOverlay();
        }
    }
    
    handleWindowBlur() {
        this.showProtectionOverlay();
    }
    
    handleWindowFocus() {
        this.hideProtectionOverlay();
    }
    
    handleKeyDown(e) {
        
        if (this.blockAllKeys) {
            e.preventDefault();
            e.stopPropagation();
            this.showProtectionOverlay();
            return false;
        }
        
        
        if (e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92) {
            this.winKeyPressed = true;
        }
        
        if (e.key === 'Control' || e.keyCode === 17) {
            this.ctrlKeyPressed = true;
        }
        
        if (e.key === 'Alt' || e.keyCode === 18) {
            this.altKeyPressed = true;
        }
        
        if (e.key === 'Shift' || e.keyCode === 16) {
            this.shiftKeyPressed = true;
        }
        
        this.disableScreenshotKeys(e);
    }
    
    handleKeyUp(e) {
        
        if (this.blockAllKeys) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        
        
        if (e.key === 'Meta' || e.key === 'OS' || e.keyCode === 91 || e.keyCode === 92) {
            this.winKeyPressed = false;
        }
        
        if (e.key === 'Control' || e.keyCode === 17) {
            this.ctrlKeyPressed = false;
        }
        
        if (e.key === 'Alt' || e.keyCode === 18) {
            this.altKeyPressed = false;
        }
        
        if (e.key === 'Shift' || e.keyCode === 16) {
            this.shiftKeyPressed = false;
        }
    }
    
    disableScreenshotKeys(e) {
        
        if (this.blockAllKeys) {
            return;
        }
        
        
        if (e.key === 'PrintScreen' || e.keyCode === 44 || e.key === 'Impr écran') {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if (this.winKeyPressed && (e.key === 'PrintScreen' || e.keyCode === 44)) {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if (this.altKeyPressed && (e.key === 'PrintScreen' || e.keyCode === 44)) {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if (this.ctrlKeyPressed && (e.key === 'PrintScreen' || e.keyCode === 44)) {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if ((this.winKeyPressed || e.metaKey) && this.shiftKeyPressed && e.key === 's') {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if (e.metaKey && this.shiftKeyPressed && (e.key === '3' || e.key === '4')) {
            e.preventDefault();
            e.stopPropagation();
            this.blockPrintScreen();
            return false;
        }
        
        
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        
        
        if (this.ctrlKeyPressed && this.shiftKeyPressed && e.key === 'I') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        
        
        if (this.ctrlKeyPressed && e.key === 'u') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    }
    
    blockPrintScreen() {
        this.showProtectionOverlay();
        this.clearClipboard();
        
        
        document.body.classList.add('screenshot-blocked');
        setTimeout(() => {
            document.body.classList.remove('screenshot-blocked');
        }, 1000);
        
        
        setTimeout(() => {
            this.hideProtectionOverlay();
        }, 2000);
    }
    
    clearClipboard() {
        
        if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([
                new window.ClipboardItem({
                    'text/plain': new Blob(['Screenshot protection active. Content protected.'], { type: 'text/plain' })
                })
            ]).catch(err => {
                
                this.clearClipboardFallback();
            });
        } else {
            
            this.clearClipboardFallback();
        }
    }
    
    clearClipboardFallback() {
        const textArea = document.createElement('textarea');
        textArea.value = 'Screenshot protection active. Content protected.';
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '0';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.select();
        
        try {
            document.execCommand('copy');
        } catch (err) {
            console.log('Failed to clear clipboard: ', err);
        }
        
        document.body.removeChild(textArea);
    }
    
    showProtectionOverlay() {
        if (this.overlay && this.screenshotProtectionActive) {
            this.overlay.style.display = 'flex';
            
            
            document.body.classList.add('screenshot-protection-active');
        }
    }
    
    hideProtectionOverlay() {
        if (this.overlay) {
            this.overlay.style.display = 'none';
            
            
            document.body.classList.remove('screenshot-protection-active');
        }
    }
    
    
    addPrintScreenBlocking() {
        
        const iframe = document.createElement('iframe');
        iframe.id = 'print-screen-blocker';
        iframe.style.position = 'fixed';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = 'none';
        iframe.style.opacity = '0';
        iframe.style.zIndex = '-1';
        iframe.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { margin: 0; overflow: hidden; }
                </style>
            </head>
            <body>
                <script>
                    document.addEventListener('keydown', function(e) {
                        if (e.key === 'PrintScreen' || e.keyCode === 44 || e.key === 'Impr écran') {
                            e.preventDefault();
                            e.stopPropagation();
                            window.parent.postMessage('printScreenAttempt', '*');
                            return false;
                        }
                    });
                <\/script>
            </body>
            </html>
        `;
        
        document.body.appendChild(iframe);
        
        
        window.addEventListener('message', (e) => {
            if (e.data === 'printScreenAttempt') {
                this.blockPrintScreen();
            }
        });
    }
    
    removePrintScreenBlocking() {
        const iframe = document.getElementById('print-screen-blocker');
        if (iframe && iframe.parentNode) {
            iframe.parentNode.removeChild(iframe);
        }
    }
    
    
    addCanvasProtection() {
        const canvas = document.createElement('canvas');
        canvas.id = 'canvas-protection';
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.zIndex = '9998';
        canvas.style.pointerEvents = 'none';
        canvas.style.opacity = '0';
        document.body.appendChild(canvas);
        
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
            
            if (Math.random() > 0.99) {
                data[i] = 255;     
                data[i + 1] = 0;   
                data[i + 2] = 0;   
                data[i + 3] = 1;   
            }
        }
        
        ctx.putImageData(imageData, 0, 0);
        
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    }
    
    removeCanvasProtection() {
        const canvas = document.getElementById('canvas-protection');
        if (canvas && canvas.parentNode) {
            canvas.parentNode.removeChild(canvas);
        }
    }
    
    
    detectDevTools() {
        const widthThreshold = 160;
        const heightThreshold = 160;
        
        if (window.outerWidth - window.innerWidth > widthThreshold || 
            window.outerHeight - window.innerHeight > heightThreshold) {
            
            this.showProtectionOverlay();
        } else {
            this.hideProtectionOverlay();
        }
    }
    
    startDevToolsDetection() {
        
        this.detectDevTools();
        
        
        this.detectionInterval = setInterval(() => {
            this.detectDevTools();
        }, 1000);
        
        
        window.addEventListener('resize', this.detectDevTools);
    }
    
    stopDevToolsDetection() {
        if (this.detectionInterval) {
            clearInterval(this.detectionInterval);
        }
        window.removeEventListener('resize', this.detectDevTools);
    }
    
    
    applyCopyProtection() {
        
        document.addEventListener('contextmenu', this.preventAction);
        
        
        document.addEventListener('selectstart', this.preventAction);
        
        
        document.addEventListener('copy', this.preventAction);
        document.addEventListener('cut', this.preventAction);
        document.addEventListener('paste', this.preventAction);
        
        
        document.addEventListener('dragstart', this.preventAction);
        document.addEventListener('drop', this.preventAction);
    }
    
    removeCopyProtection() {
        
        document.removeEventListener('contextmenu', this.preventAction);
        document.removeEventListener('selectstart', this.preventAction);
        document.removeEventListener('copy', this.preventAction);
        document.removeEventListener('cut', this.preventAction);
        document.removeEventListener('paste', this.preventAction);
        document.removeEventListener('dragstart', this.preventAction);
        document.removeEventListener('drop', this.preventAction);
    }
    
    preventAction(e) {
        e.preventDefault();
        return false;
    }
    
    
    addProtectiveCSS() {
        const style = document.createElement('style');
        style.id = 'protective-css';
        style.textContent = `
            .protected-content {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            
            .protected-content img {
                pointer-events: none;
            }
            
           
            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle, transparent 20%, black 70%);
                opacity: 0.02;
                pointer-events: none;
                z-index: 99999;
                animation: flicker 0.01s infinite;
            }
            
            @keyframes flicker {
                0% { opacity: 0.02; }
                50% { opacity: 0.03; }
                100% { opacity: 0.02; }
            }
            
           
            body.screenshot-protection-active {
                filter: brightness(98%) contrast(101%);
            }
            
            body.screenshot-protection-active .protected-content {
                filter: blur(0.5px);
            }
            
           
            .screenshot-blocked {
                animation: screenshotFlash 0.5s ease;
            }
            
            @keyframes screenshotFlash {
                0% { filter: brightness(100%); }
                50% { filter: brightness(70%); }
                100% { filter: brightness(100%); }
            }
        `;
        document.head.appendChild(style);
        
        
        document.body.classList.add('protected-content');
    }
    
    removeProtectiveCSS() {
        const style = document.getElementById('protective-css');
        if (style && style.parentNode) {
            style.parentNode.removeChild(style);
        }
        
        
        document.body.classList.remove('protected-content');
        document.body.classList.remove('screenshot-protection-active');
        document.body.classList.remove('screenshot-blocked');
    }
    
    
    blockAllKeyboardInput() {
        this.keyboardBlocked = true;
        
        
        const keyboardBlocker = document.createElement('div');
        keyboardBlocker.id = 'keyboard-blocker';
        keyboardBlocker.style.position = 'fixed';
        keyboardBlocker.style.top = '0';
        keyboardBlocker.style.left = '0';
        keyboardBlocker.style.width = '100%';
        keyboardBlocker.style.height = '100%';
        keyboardBlocker.style.zIndex = '99999';
        keyboardBlocker.style.background = 'transparent';
        keyboardBlocker.tabIndex = 0;
        keyboardBlocker.addEventListener('keydown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });
        keyboardBlocker.addEventListener('keyup', (e) => {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });
        document.body.appendChild(keyboardBlocker);
        keyboardBlocker.focus();
    }
    
    
    releaseAllKeyboardInput() {
        this.keyboardBlocked = false;
        
        const keyboardBlocker = document.getElementById('keyboard-blocker');
        if (keyboardBlocker && keyboardBlocker.parentNode) {
            keyboardBlocker.parentNode.removeChild(keyboardBlocker);
        }
    }
}
